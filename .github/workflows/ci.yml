name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate packaging scripts
        run: bash -n scripts/build-management.sh scripts/build.sh scripts/apple-preflight.sh scripts/notarize.sh
      - name: Unit tests
        run: swift test
      - name: Verify update status UI
        run: scripts/test-status-update.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare management build references
        run: |
          export VSM_HOME="$RUNNER_TEMP/valheim-build-runtime"
          "$(swift build --show-bin-path)/ValheimServerMonitor" --control install
          echo "GAME_MANAGED_PATH=$VSM_HOME/runtime/server/valheim_server/Data/Managed" >> "$GITHUB_ENV"
      - name: Build universal app
        run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Valheim-Server-Manager-for-Mac-development
          path: |
            dist/Valheim-Server-Manager-for-Mac.zip
            dist/SHA256SUMS.txt
