name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Build universal app
        run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Valhiem-Server-Manager-for-Mac-unsigned-preview
          path: |
            dist/Valhiem-Server-Manager-for-Mac.zip
            dist/SHA256SUMS.txt
